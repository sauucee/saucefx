# Build and verify packages on GitHub, deploy the signed Flatpak source,
# confirm it is live, then publish the release downloads.
name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  packages:
    name: Build native packages
    uses: ./.github/workflows/native-packages.yml
    secrets: inherit

  publish:
    permissions:
      contents: write
      actions: write
    name: Deploy update source and publish release
    needs: packages
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install signature-verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree

      - name: Configure authenticated repository publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Download tested packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true

      - name: Drop debug packages and generate checksums
        run: |
          cd release
          find . -name '*debug*' -delete
          sha256sum *.AppImage *.flatpak *.flatpakref *.pkg.tar.zst *.rpm *.deb > SHA256SUMS

      - name: Publish verified signed Flatpak source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I packaging/native/flatpak/publish-repository.py release/flatpak-repository.tar.gz

      - name: Deploy and verify the live update source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I packaging/native/flatpak/deploy-repository.py release/flatpak-repository.tar.gz

      - name: Publish release downloads
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/*.AppImage
            release/*.flatpak
            release/*.flatpakref
            release/*.pkg.tar.zst
            release/*.rpm
            release/*.deb
            release/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
