# Release pipeline for the Rust/Slint native UI. A v* tag builds all five
# package formats through the reusable native-packages workflow and attaches
# them to the GitHub release. Publishing remains an explicit owner action:
# it only happens when the owner pushes a tag. The legacy JUCE pipeline was
# replaced when the native UI merged to main.
name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    name: Build native packages
    uses: ./.github/workflows/native-packages.yml

  publish:
    name: Publish GitHub release
    needs: packages
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Drop debug packages and generate checksums
        run: |
          cd release
          find . -name '*debug*' -delete
          sha256sum *.AppImage *.flatpak *.pkg.tar.zst *.rpm *.deb > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.flatpak
            release/*.pkg.tar.zst
            release/*.rpm
            release/*.deb
            release/SHA256SUMS
          generate_release_notes: true