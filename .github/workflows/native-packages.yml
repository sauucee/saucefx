# Packages for the Rust/Slint native UI. Builds every format from source on
# GitHub (the DSP archives are compiled here, never committed). Reusable:
# release.yml calls this on v* tags and publishes the artifacts. Pushes to
# the development branch and manual dispatch also build all formats.
name: Native packages

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [rust-native-ui]

permissions:
  contents: read

jobs:
  appimage:
    name: Portable AppImage (native UI)
    runs-on: ubuntu-22.04
    env:
      SAUCEFX_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Skia's C++ build needs a recent clang; jammy's default is too old.
      - name: Install LLVM 18
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s 18
          sudo apt-get install -y libclang-18-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Install build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ make pkg-config curl file patchelf ninja-build \
            libpipewire-0.3-dev libpulse-dev libasound2-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 \
            desktop-file-utils imagemagick \
            pipewire pipewire-pulse wireplumber pulseaudio-utils \
            dbus-x11 xvfb xauth python3

      - name: Build AppImage
        env:
          CC: clang-18
          CXX: clang++-18
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: packaging/native/appimage/build-appimage.sh

      - name: Test workspace including host regressions
        env:
          CC: clang-18
          CXX: clang++-18
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          cargo fmt --all -- --check
          xvfb-run -a cargo test --workspace --locked --jobs 2 \
            --no-default-features --features saucefx-host/renderer-skia,saucefx-ui/renderer-skia \
            -- --test-threads=1

      - name: Test direct-playback output restore
        env:
          CC: clang-18
          CXX: clang++-18
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: bash packaging/native/test-direct-output.sh

      - name: Test native updater inside a signed Flatpak fixture
        env:
          CC: clang-18
          CXX: clang++-18
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          sudo apt-get install -y flatpak gnupg ostree
          cargo build --locked -p saucefx-host --example updater_probe --no-default-features --features renderer-skia
          bash packaging/native/flatpak/test-in-app-update.sh target/debug/examples/updater_probe

      - name: Smoke-test portable AppImage
        run: packaging/native/appimage/smoke-test.sh release/SauceFX-*-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: saucefx-native-appimage
          path: release/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle (native UI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The build sandbox has no network: vendor every crate from Cargo.lock
      # and pre-fetch the Skia binaries archive skia-bindings would download.
      - name: Generate cargo sources manifest
        run: |
          python3 -m venv /tmp/cargo-gen
          /tmp/cargo-gen/bin/pip install -q tomlkit aiohttp
          git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools /tmp/fbt
          /tmp/cargo-gen/bin/python /tmp/fbt/cargo/flatpak-cargo-generator.py \
            Cargo.lock -o packaging/native/flatpak/cargo-sources.json

      - name: Fetch prebuilt Skia binaries
        run: |
          # Key is specific to skia-bindings 0.153.3 + this target + the
          # Slint renderer's Skia feature set; refresh it on slint bumps.
          curl -fsSL -o packaging/native/flatpak/skia-binaries.tar.gz \
            https://github.com/rust-skia/skia-binaries/releases/download/0.153.3/skia-binaries-b7f043e0b1e2a850e702-x86_64-unknown-linux-gnu-ganesh-gl-jpegd-jpege-pdf-vulkan.tar.gz
          echo "9ebe4c448cc9f789bad241cbd11739cdf759e27db5719c23a7635e096d5807b3  packaging/native/flatpak/skia-binaries.tar.gz" | sha256sum -c -

      # From-source build inside the sandbox: the llvm22 extension provides
      # clang/libclang for the 26.08 SDK (the base ships none), rust-stable
      # provides cargo. No runner toolchain needed.
      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils gnupg \
            pipewire pipewire-pulse wireplumber pulseaudio-utils dbus-x11 xvfb xauth
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//51 org.gnome.Sdk//51 org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08 \
            org.freedesktop.Sdk.Extension.llvm22//26.08

      - name: Prepare update signing
        env:
          FLATPAK_SIGNING_KEY: ${{ secrets.FLATPAK_SIGNING_KEY }}
        run: python3 -I packaging/native/flatpak/prepare-signing.py

      - name: Build Flatpak
        run: packaging/native/flatpak/build-flatpak.sh

      - name: Verify bundle upgrade from 0.2.4
        run: |
          mkdir -p /tmp/saucefx-old-release
          curl -fsSL -o /tmp/saucefx-old-release/SauceFX-0.2.4.flatpak \
            https://github.com/sauucee/saucefx/releases/download/v0.2.4/SauceFX-0.2.4-x86_64.flatpak
          bash packaging/native/flatpak/test-upgrade.sh \
            /tmp/saucefx-old-release/SauceFX-0.2.4.flatpak release/SauceFX-*-x86_64.flatpak

      - name: Install bundle and launch-check
        run: |
          flatpak install --user -y --noninteractive --or-update release/SauceFX-*-x86_64.flatpak
          flatpak run --no-documents-portal --command=sh io.github.sauucee.SauceFX -c 'command -v zenity'
          packaging/native/flatpak/smoke-test.sh

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: saucefx-native-flatpak
          path: |
            release/*.flatpak
            release/*.flatpakref
            release/flatpak-repository.tar.gz
          if-no-files-found: error

  arch:
    name: Arch pacman package (native UI)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          # Every PKGBUILD depends/makedepends must be present up front:
          # makepkg runs as an unprivileged user and cannot sudo-install.
          pacman -Syu --noconfirm --needed \
            git nodejs rust clang ninja pkgconf \
            pipewire pipewire-pulse libpulse libxkbcommon fontconfig freetype2 libglvnd \
            zenity desktop-file-utils hicolor-icon-theme

      - uses: actions/checkout@v4

      - name: Build package
        run: packaging/native/arch/build-pkg.sh

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: saucefx-native-arch
          path: release/*.pkg.tar.zst
          if-no-files-found: error

  rpm:
    name: RPM package (native UI)
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git nodejs gcc-c++ make rust cargo clang llvm-devel \
            ninja-build pkgconf-pkg-config pipewire-devel pulseaudio-libs-devel \
            fontconfig-devel freetype-devel libxkbcommon-devel mesa-libGL-devel \
            mesa-libEGL-devel desktop-file-utils libappstream-glib appstream rpm-build

      - uses: actions/checkout@v4

      - name: Build package
        run: packaging/native/rpm/build-rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: saucefx-native-rpm
          path: release/*.rpm
          if-no-files-found: error

  deb:
    name: DEB package (native UI)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install LLVM 18
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s 18
          sudo apt-get install -y libclang-18-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Install build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ make pkg-config ninja-build \
            libpipewire-0.3-dev libpulse-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            desktop-file-utils dpkg-dev

      - name: Build host (Skia)
        env:
          CC: clang-18
          CXX: clang++-18
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          make -C src rt -j2
          CARGO_BUILD_JOBS=2 cargo build --release -p saucefx-host \
            --no-default-features --features renderer-skia

      - name: Build package
        run: packaging/native/deb/build-deb.sh

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: saucefx-native-deb
          path: release/*.deb
          if-no-files-found: error