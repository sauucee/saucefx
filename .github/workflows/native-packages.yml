# Packages for the Rust/Slint native UI. Builds every format from source on
# GitHub (the DSP archives are compiled here, never committed). During the
# migration every push to rust-native-ui builds the packages; once the
# migration merges, this becomes tag-triggered and replaces the JUCE
# release workflow's publish job (publishing stays an explicit owner action).
name: Native packages

on:
  workflow_dispatch:
  push:
    branches: [rust-native-ui]

permissions:
  contents: read

jobs:
  appimage:
    name: Portable AppImage (native UI)
    runs-on: ubuntu-22.04
    env:
      SAUCEFX_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Skia's C++ build needs a recent clang; jammy's default is too old.
      - name: Install LLVM 18
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s 18
          sudo apt-get install -y libclang-18-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Install build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ make pkg-config curl file patchelf ninja-build \
            libpipewire-0.3-dev libpulse-dev libasound2-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 \
            desktop-file-utils imagemagick \
            pipewire pipewire-pulse wireplumber pulseaudio-utils \
            dbus-x11 xvfb xauth python3

      - name: Build AppImage
        env:
          CC: clang-18
          CXX: clang++-18
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: packaging/native/appimage/build-appimage.sh

      - name: Smoke-test portable AppImage
        run: packaging/native/appimage/smoke-test.sh release/SauceFX-*-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: saucefx-native-appimage
          path: release/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle (native UI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils \
            pipewire pipewire-pulse wireplumber pulseaudio-utils dbus-x11 xvfb xauth
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//51 org.gnome.Sdk//51 \
            org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08

      - name: Locate clang/libclang in the SDK
        run: |
          # The 26.08 SDK ships clang in the base; there is no llvm
          # extension for this branch. Discover the libclang directory and
          # substitute it into the manifest. --no-documents-portal: CI has
          # no document portal service.
          flatpak run --no-documents-portal --command=sh org.gnome.Sdk//51 -c \
            'command -v clang clang++ gcc g++; find /usr/lib -maxdepth 4 -name "libclang*.so*" 2>/dev/null | head -5; ls -d /usr/lib/llvm* 2>/dev/null' \
            | tee /tmp/sdk-probe.txt
          LIBCLANG_DIR=$(grep -oE '/usr/lib[^ ]*libclang[^ ]*\.so[^ ]*' /tmp/sdk-probe.txt | head -1 | xargs -r dirname)
          if [ -z "$LIBCLANG_DIR" ]; then
            echo "libclang not found; SDK inventory:" >&2
            flatpak run --no-documents-portal --command=sh org.gnome.Sdk//51 -c \
              'ls /usr/bin | grep -iE "clang|llvm" | head; find /usr -name "libclang*" 2>/dev/null | head' >&2 || true
            exit 1
          fi
          echo "LIBCLANG_DIR=$LIBCLANG_DIR"
          sed -i "s|LIBCLANGDIR|$LIBCLANG_DIR|g" packaging/native/flatpak/github-bundle.yml

      - name: Build Flatpak
        run: packaging/native/flatpak/build-flatpak.sh

      - name: Install bundle and launch-check
        run: |
          flatpak install --user -y --noninteractive release/SauceFX-*-x86_64.flatpak
          flatpak run --no-documents-portal --command=sh io.github.sauucee.SauceFX -c 'command -v zenity'
          packaging/native/flatpak/smoke-test.sh

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: saucefx-native-flatpak
          path: release/*.flatpak
          if-no-files-found: error

  arch:
    name: Arch pacman package (native UI)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git nodejs rust clang ninja pkgconf \
            pipewire libpulse libxkbcommon fontconfig freetype2 libglvnd \
            zenity desktop-file-utils

      - uses: actions/checkout@v4

      - name: Build package
        run: packaging/native/arch/build-pkg.sh

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: saucefx-native-arch
          path: release/*.pkg.tar.zst
          if-no-files-found: error