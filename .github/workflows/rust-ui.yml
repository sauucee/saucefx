# Builds the Rust/Slint UI on CI: runs the test suite under Xvfb and produces
# release binaries of both GPU renderers. Skia's glyph rasterization is the
# quality fix for the soft text femtovg produces (no hinting, grayscale AA),
# and its C++ build is what makes CI worthwhile — the local machine cannot
# spare the RAM for skia-bindings.
#
# The host binary is NOT built here: it links the prebuilt DSP archives in
# src/build/, which are deliberately not in git (protected audio baseline).

name: rust-ui

on:
  pull_request:
    branches: [main]
  push:
    branches: [rust-native-ui]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # clang/ninja for the skia-bindings C++ build; fontconfig headers for
      # fontique; xvfb plus the xkbcommon X11 runtime for the Slint tests that
      # need a live display (winit panics without libxkbcommon-x11).
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Test (core + ui, host needs untracked DSP archives)
        run: xvfb-run -a cargo test -p saucefx-core -p saucefx-ui -- --test-threads=1

      - name: Build release (femtovg, default)
        run: |
          cargo build --release -p saucefx-ui
          cp target/release/preview target/release/preview-femtovg

      - name: Build release (skia)
        run: |
          cargo build --release -p saucefx-ui --no-default-features --features renderer-skia
          cp target/release/preview target/release/preview-skia

      - name: Capture Settings update states
        run: |
          mkdir -p updater-scenes
          for scene in settings updates-busy updates-error updates-restart updates-light; do
            target/release/capture "$scene" "updater-scenes/$scene.png"
          done

      - name: Upload update-state captures
        uses: actions/upload-artifact@v4
        with:
          name: updater-settings-${{ github.sha }}
          path: updater-scenes/*.png
          if-no-files-found: error

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: saucefx-ui-${{ github.sha }}
          path: |
            target/release/preview-femtovg
            target/release/preview-skia
            target/release/capture
          if-no-files-found: error

  # Renders the Settings scene in every Skia text variant on a private
  # Xvfb and uploads the captures, so text-quality verdicts happen against
  # real pixels without anyone building locally.
  text-gallery:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: saucefx-ui-${{ github.sha }}
          path: ci-bin

      - name: Install capture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick x11-apps libfontconfig1 libxkbcommon-x11-0 libgl1 libgl1-mesa-dri libegl1

      - name: Render Settings text variants
        run: |
          chmod +x ci-bin/preview-skia ci-bin/preview-femtovg
          mkdir -p gallery
          Xvfb :99 -screen 0 1280x800x24 -noreset &
          XVFB_PID=$!
          sleep 1
          # Warm up the software GL driver: the first Skia window can take
          # several seconds to draw its first frame (llvmpipe cold start).
          env DISPLAY=:99 SAUCEFX_PREVIEW_SCENE=settings SAUCEFX_PREVIEW_EXIT_MS=8000 ci-bin/preview-skia >gallery/warmup.log 2>&1 &
          warm=$!
          sleep 6
          kill "$warm" 2>/dev/null || true
          wait "$warm" 2>/dev/null || true
          render() {
            name=$1; bin=$2; shift 2
            env DISPLAY=:99 SAUCEFX_PREVIEW_SCENE=settings SAUCEFX_PREVIEW_EXIT_MS=15000 "$@" "$bin" >"gallery/$name.log" 2>&1 &
            pid=$!
            sleep 4
            xwd -root -display :99 -silent | convert xwd:- "gallery/$name.png" || echo "capture failed: $name"
            # A black 1280x800 frame compresses to <1 KB; retry once.
            if [ "$(stat -c %s "gallery/$name.png" 2>/dev/null || echo 0)" -lt 5000 ]; then
              sleep 3
              xwd -root -display :99 -silent | convert xwd:- "gallery/$name.png" || true
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          render default          ci-bin/preview-skia
          render skia-slight-lcd  ci-bin/preview-skia SAUCEFX_SKIA_LCD=1 SAUCEFX_SKIA_SUBPIXEL=0
          render skia-full-lcd    ci-bin/preview-skia SAUCEFX_SKIA_HINTING=full SAUCEFX_SKIA_LCD=1 SAUCEFX_SKIA_SUBPIXEL=0
          render skia-slight-gray ci-bin/preview-skia SAUCEFX_SKIA_SUBPIXEL=0
          render skia-full-gray   ci-bin/preview-skia SAUCEFX_SKIA_HINTING=full SAUCEFX_SKIA_SUBPIXEL=0
          render skia-off-gray    ci-bin/preview-skia SAUCEFX_SKIA_HINTING=off SAUCEFX_SKIA_SUBPIXEL=0
          render skia-slight-gray-sub ci-bin/preview-skia SAUCEFX_SKIA_SUBPIXEL=1
          render skia-slight-lcd-sub  ci-bin/preview-skia SAUCEFX_SKIA_LCD=1 SAUCEFX_SKIA_SUBPIXEL=1
          render femtovg-base     ci-bin/preview-femtovg
          kill "$XVFB_PID" 2>/dev/null || true
          ls -la gallery

      - name: Upload text gallery
        uses: actions/upload-artifact@v4
        with:
          name: text-gallery-${{ github.sha }}
          path: gallery/*.png
          if-no-files-found: error
