[workspace]
resolver = "3"
members = ["crates/saucefx-core", "crates/saucefx-ui", "crates/saucefx-host"]

[workspace.package]
# Tracks the shipped SauceFX application version (frontend/package.json),
# which the Settings footer mirrors.
version = "0.2.4"
edition = "2024"
license = "AGPL-3.0-only"

# Vendored copy of i-slint-renderer-skia 1.18.1 with subpixel glyph
# positioning disabled, so FreeType hinting can align small text the way the
# reference browser does (see the SAUCEFX PATCH note in itemrenderer.rs).
# Re-vendor from the matching registry crate whenever slint is bumped.
[patch.crates-io]
i-slint-renderer-skia = { path = "third-party/i-slint-renderer-skia" }
