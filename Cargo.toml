[workspace]
resolver = "3"
members = ["crates/saucefx-core", "crates/saucefx-ui", "crates/saucefx-host"]

[workspace.package]
# Shipped SauceFX application version; the packaging scripts and the
# Settings footer read it from here.
version = "0.3.6"
edition = "2024"
license = "AGPL-3.0-only"

# Vendored copy of i-slint-renderer-skia 1.18.1 with the SauceFX text patch:
# fractional glyph positions + Slight FreeType hinting + grayscale masks by
# default (the verified reference-matching combo; SAUCEFX_SKIA_HINTING /
# SAUCEFX_SKIA_LCD / SAUCEFX_SKIA_SUBPIXEL env toggles for A/B). Re-vendor
# from the matching registry crate whenever slint is bumped.
[patch.crates-io]
i-slint-renderer-skia = { path = "third-party/i-slint-renderer-skia" }
