<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111214" />
    <title>SauceFX</title>
    <script>
      try {
        const hostData = window.__JUCE__?.initialisationData
        const hostTheme = hostData?.saucefxTheme?.[0]
        const theme =
          hostTheme === 'light'
            ? 'light'
            : hostTheme === 'dark'
              ? 'dark'
              : localStorage.getItem('saucefx.theme') === 'light'
                ? 'light'
                : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        const accents = {
          rose: '#f2486f',
          blue: '#3b82f6',
          green: '#2fa572',
          teal: '#12a8a0',
          amber: '#d4922a',
          violet: '#8b7cf6',
        }
        const hostAccent = hostData?.saucefxAccent?.[0]
        const stored =
          typeof hostAccent === 'string'
            ? hostAccent
            : localStorage.getItem('saucefx.accent') || ''
        const accent = /^#[0-9a-f]{6}$/i.test(stored)
          ? stored
          : accents[stored] || accents.rose
        const rgb = [
          parseInt(accent.slice(1, 3), 16),
          parseInt(accent.slice(3, 5), 16),
          parseInt(accent.slice(5, 7), 16),
        ].join(', ')
        document.documentElement.style.setProperty('--accent-rgb', rgb)
        document.documentElement.style.setProperty('--accent', accent)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
