[package]
name = "saucefx-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    "unstable-fontique-011",
    # Native minimize and title-bar dragging need the winit window handle.
    "unstable-winit-030",
] }
# PNG output for the offscreen UI capture tool.
image = { version = "0.25", default-features = false, features = ["png"] }
saucefx-core = { path = "../saucefx-core" }

[build-dependencies]
slint-build = "=1.18.1"
