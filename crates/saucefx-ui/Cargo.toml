[package]
name = "saucefx-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
    "unstable-fontique-011",
    # Native minimize and title-bar dragging need the winit window handle.
    "unstable-winit-030",
] }
# PNG output for the offscreen UI capture tool.
image = { version = "0.25", default-features = false, features = ["png"] }
saucefx-core = { path = "../saucefx-core" }

[features]
default = ["renderer-skia"]
# GPU renderers for the live window. Skia is the default: its glyph
# rasterization (FreeType + Slight hinting) is the quality fix for the soft
# text femtovg produces (no hinting, grayscale AA), and every shipped package
# builds `--no-default-features --features renderer-skia`. The winit backend
# prefers femtovg when both are compiled in, so the femtovg build drops Skia
# instead of layering behind it:
# `cargo build --no-default-features --features renderer-femtovg`.
# renderer-software stays on unconditionally: the offscreen capture tool and
# the tests render through it without a GPU.
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-skia = ["slint/renderer-skia"]

[build-dependencies]
slint-build = "=1.18.1"
