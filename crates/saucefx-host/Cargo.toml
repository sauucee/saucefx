[package]
name = "saucefx-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "saucefx"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "accessibility",
    "compat-1-2",
    "unstable-winit-030",
] }
saucefx-core = { path = "../saucefx-core" }
libc = "0.2"
tempfile = "3"
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
futures-lite = "=2.6.1"
async-io = "=2.6.0"
saucefx-ui = { path = "../saucefx-ui", default-features = false }

[features]
default = ["renderer-femtovg"]
# Mirror saucefx-ui: winit prefers femtovg when both renderers are compiled
# in, so the Skia build drops femtovg instead of layering behind it:
# `cargo build -p saucefx-host --no-default-features --features renderer-skia`.
renderer-femtovg = ["slint/renderer-femtovg", "saucefx-ui/renderer-femtovg"]
renderer-skia = ["slint/renderer-skia", "saucefx-ui/renderer-skia"]
