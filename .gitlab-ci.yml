# Verification pipeline for the GitLab mirror. While GitHub Actions minutes
# are exhausted, this runs the same checks as the GitHub workflows: fmt plus
# the full workspace test suite, with the DSP archives built in-pipeline so
# the host crate can compile.
#
# Deliberately light: no package builds, no release artifacts, no Skia —
# the UI tests render through renderer-software, and the host links its
# prebuilt archives after `make -C src rt`. GitLab's free tier gives 400
# compute minutes per month; this pipeline costs ~15 minutes per run.
stages: [test, package]

variables:
  GIT_DEPTH: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

test:
  stage: test
  image: rust:1-bookworm
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y -qq
      g++ gcc make pkg-config curl file clang libclang-dev
      libpipewire-0.3-dev libpulse-dev libasound2-dev
      libx11-dev libx11-xcb1 libxcb1 libxi6 libxext-dev libxinerama1
      libxrandr2 libxcursor1 libxcomposite1 libxfixes3 libxrender1
      libfreetype6-dev libfontconfig1-dev
      libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev
      libxkbcommon-dev libxkbcommon-x11-0
      dbus-x11 xvfb xauth git
    - rustup component add rustfmt
  script:
    # DSP archives the host crate links (same as the AppImage pipeline).
    - make -C src rt -j"$(nproc)"
    - rustc --version && cargo --version
    - cargo fmt --all -- --check
    # UI tests render through renderer-software, which this crate builds
    # unconditionally — no renderer feature is needed or defined. Dropping
    # default features skips the Skia compile entirely.
    - xvfb-run -a cargo test -p saucefx-core -p saucefx-ui
        --no-default-features -- --test-threads=1
    - cargo test -p saucefx-host

  # Build the AppImage for the current release and upload it to the GitHub
  # release with the configured GITHUB_TOKEN. Only runs when that variable
  # exists, so the light test pipeline stays the default.
  build-appimage:
    stage: package
    image: ubuntu:24.04
    rules:
      - if: '$CI_COMMIT_TAG =~ /^v/'
    before_script:
      - export DEBIAN_FRONTEND=noninteractive
      - apt-get update -qq
      - apt-get install -y -qq
        g++ gcc make pkg-config curl file patchelf clang libclang-dev
        libpipewire-0.3-dev libpulse-dev libasound2-dev
        libx11-dev libx11-xcb1 libxi6 libxext-dev libxinerama1 libxrandr2
        libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev
        libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev
        libxkbcommon-dev libxkbcommon-x11-0 desktop-file-utils
        pipewire pipewire-pulse wireplumber pulseaudio-utils
        dbus-x11 xvfb xauth git
      - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal -c rustfmt
      - source "$HOME/.cargo/env"
    script:
      - make -C src rt -j"$(nproc)"
      - packaging/native/appimage/build-appimage.sh
      - cd release && sha256sum *.AppImage > SHA256SUMS
    artifacts:
      paths:
        - release/*.AppImage
        - release/SHA256SUMS

  # A separate job owns the release: keyword. An empty $CI_COMMIT_TAG on
  # branch pipelines would fail job generation for the whole pipeline —
  # this job only exists on tag pipelines, where the tag is always set.
  publish-release:
    stage: package
    needs: ["build-appimage"]
    rules:
      - if: '$CI_COMMIT_TAG =~ /^v/'
    image: alpine:latest
    script:
      - echo "Publishing $CI_COMMIT_TAG from the build-appimage artifacts."
    release:
      tag_name: '$CI_COMMIT_TAG'
      name: 'SauceFX $CI_COMMIT_TAG'
      description: 'Test build from the GitLab mirror. Unsigned; the in-app
        updater is not part of this pipeline.'
      assets:
        links:
          - name: 'Packages (download from the build job artifacts)'
            url: '$CI_PIPELINE_URL'
